# Full stack: postgres, migrate, api, web, scheduler
# From repo root: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build

name: tan

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tan}
      POSTGRES_DB: ${POSTGRES_DB:-tan_predictions}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tan} -d ${POSTGRES_DB:-tan_predictions}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tan_net

  migrate:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    image: ${TAN_API_IMAGE:-tan-api:local}
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: python -c "from technical_analysis_trainer.storage.prediction_store import init_db; init_db()"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tan_net

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    image: ${TAN_API_IMAGE:-tan-api:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QUANTILE_MODEL_RUN: ${QUANTILE_MODEL_RUN}
      TREND_MODEL_RUN: ${TREND_MODEL_RUN:-}
      TREND_REALTIME_CONFIG: ${TREND_REALTIME_CONFIG}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      PYTHONPATH: /app
    volumes:
      - ../technical_analysis_trainer/models/quantile/models:/app/technical_analysis_trainer/models/quantile/models:ro
      - ../technical_analysis_trainer/models/trend/models:/app/technical_analysis_trainer/models/trend/models:ro
      - ../technical_analysis_trainer/data:/app/technical_analysis_trainer/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tan_net

  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
    image: ${TAN_WEB_IMAGE:-tan-web:local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tan_net

  trading_bot:
    build:
      context: ..
      dockerfile: trading_bot/Dockerfile
    image: ${TAN_TRADING_BOT_IMAGE:-tan-trading-bot:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STRATEGY_CONFIG: /config/strategy.yaml
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      DATABASE_URL: ${DATABASE_URL}
      TRADE_LOG_PATH: /var/log/trades.jsonl
      STATE_PATH: /var/lib/trading_bot/state.json
    volumes:
      - ../trading_bot/config/strategy.yaml:/config/strategy.yaml:ro
      - trading_bot_logs:/var/log
      - trading_bot_state:/var/lib/trading_bot
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - tan_net

  scheduler:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    image: ${TAN_API_IMAGE:-tan-api:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QUANTILE_MODEL_RUN: ${QUANTILE_MODEL_RUN}
      TREND_MODEL_RUN: ${TREND_MODEL_RUN:-}
      TREND_REALTIME_CONFIG: ${TREND_REALTIME_CONFIG}
      PREDICTION_SYMBOL: ${PREDICTION_SYMBOL:-BTCUSDT}
      PREDICTION_INTERVAL: ${PREDICTION_INTERVAL:-1h}
      PREDICTION_BINANCE_LIMIT: ${PREDICTION_BINANCE_LIMIT:-45}
      PYTHONPATH: /app
    volumes:
      - ../technical_analysis_trainer/models/quantile/models:/app/technical_analysis_trainer/models/quantile/models:ro
      - ../technical_analysis_trainer/models/trend/models:/app/technical_analysis_trainer/models/trend/models:ro
      # NOT read-only, unlike the api service. The scheduler is the process that
      # MAINTAINS this directory: macro_fred writes data/train and data/predict,
      # and binance_derivatives writes data/derivatives. Mounted `:ro` — as it
      # was until 2026-09-09 — every one of those cron jobs fails on write, into
      # a log nobody reads, which is precisely the silent-staleness failure the
      # crontab's own comment describes ("this is exactly how two of the 54
      # features went dead in production"). The fetch jobs were added to fix that
      # and could not have worked.
      #
      # The derivatives series make this worse than stale data: Binance keeps 30
      # days and refuses older startTime, so a failed write is not recoverable by
      # running it again later.
      - ../technical_analysis_trainer/data:/app/technical_analysis_trainer/data
      - scheduler_logs:/var/log
    command: ["/usr/local/bin/supercronic", "/etc/crontab"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - tan_net

  # Liquidations are a DAEMON, not a cron job: /fapi/v1/allForceOrders is 404 and
  # the websocket remembers nothing, so anything that happens while this is down
  # is gone. Unlike the 30-day REST series it cannot be caught up at all.
  liquidations:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    image: ${TAN_API_IMAGE:-tan-api:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ../technical_analysis_trainer/data:/app/technical_analysis_trainer/data
    command: ["python", "-m", "technical_analysis_trainer.data_fetch.binance_liquidations", "--run"]
    networks:
      - tan_net

volumes:
  pgdata:
  scheduler_logs:
  trading_bot_logs:
  trading_bot_state:

networks:
  tan_net:
    driver: bridge
