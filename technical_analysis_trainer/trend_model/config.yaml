# General settings
symbol: BTCUSDT
data_path: technical_analysis_trainer/data/btcusdt_1h_all_time.csv
# seed: число — воспроизводимый запуск; seed: auto — новый seed каждый прогон (см. train.py resolve_seed_into_cfg)
seed: auto
# Непрерывное обучение: после каждого сохранения модели снова читается этот конфиг и стартует новый прогон (Ctrl+C — стоп)
continuous_training: true

# Model parameters
epochs: 200
learning_rate: 0.0005
hidden_size: 32
num_layers: 2
# Регуляризация: даём модели учиться, переобучение режем early stopping
weight_decay: 0.0005        # слабый L2 (0.002 держал loss на ~0.69)
patience: 25                # стоп, когда val_loss не улучшался 25 эпох
dropout_lstm: 0.2           # только при num_layers > 1
dropout_fc: 0.1             # dropout перед fc
batch_size: 64

# Data parameters
threshold: 0.001   # порог return для метки UP/DOWN (|return| <= threshold → бар не используется)
horizon: 1         # на сколько баров вперёд считаем return для таргета
class_weight: auto   # раскомментировать при дисбалансе классов (или задать [w_down, w_up])
n_estimators: 100
max_depth: 8
cv_splits: 5
output_dir: technical_analysis_trainer/trend_model/models
# seq_len для LSTM берётся из long. 30 = больше суток — можно попробовать 12 (полдня)
window:
  short: 1
  mid: 6
  long: 24
