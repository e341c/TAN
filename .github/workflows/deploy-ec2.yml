name: Deploy EC2

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "technical_analysis_trainer/**"
      - "deploy/**"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase owner for GHCR
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/tan-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/tan-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/tan-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/tan-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Lowercase owner for GHCR
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          API_IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/tan-api:latest
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/tan-web:latest
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,API_IMAGE,WEB_IMAGE,GHCR_TOKEN,GITHUB_ACTOR
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/opt/tan-model}"
            cd "$APP_DIR"
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
            export TAN_API_IMAGE="$API_IMAGE"
            export TAN_WEB_IMAGE="$WEB_IMAGE"
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env pull
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --no-build --remove-orphans
            docker image prune -f
